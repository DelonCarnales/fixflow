name: FixFlow checks

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "openapi.yaml"
      - ".github/workflows/frontend-tests.yml"
      - ".devcontainer/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "openapi.yaml"
      - ".github/workflows/frontend-tests.yml"
      - ".devcontainer/**"

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install browser test dependency
        run: |
          python -m pip install -r frontend/requirements-test.txt
          python -m pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate Codespaces configuration
        run: |
          python -c "import json; json.load(open('.devcontainer/devcontainer.json'))"
          bash -n .devcontainer/start.sh
      - name: Check JavaScript syntax
        run: |
          node --check frontend/src/app.js
          node --check frontend/src/services/service.js
          node --check frontend/src/services/apiService.js
          node --check frontend/src/services/mockService.js
          node --check frontend/src/services/mockService.test.js
      - name: Run mock service tests
        working-directory: frontend
        run: npm test
      - name: Start backend server with SQLite
        run: |
          cd backend
          DATABASE_URL=sqlite:///./ci.db python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/fixflow-backend.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fixflow-backend.log
          exit 1
      - name: Start frontend server
        run: |
          python -m http.server 5173 --directory frontend > /tmp/fixflow-server.log 2>&1 &
          for attempt in $(seq 1 15); do
            if curl --silent --fail http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fixflow-server.log
          exit 1
      - name: Run browser smoke tests
        run: python frontend/tests/browser_smoke.py

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend and contract tests
        working-directory: backend
        run: python -m pytest -q
