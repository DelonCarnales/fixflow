name: Frontend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependency
        run: |
          python -m pip install -r frontend/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check frontend/src/app.js
          node --check frontend/src/services/mockService.js
          node --check frontend/src/services/mockService.test.js
      - name: Run mock service tests
        working-directory: frontend
        run: npm test
      - name: Start frontend server
        run: |
          python -m http.server 5173 --directory frontend > /tmp/fixflow-server.log 2>&1 &
          for attempt in $(seq 1 15); do
            if curl --silent --fail http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fixflow-server.log
          exit 1
      - name: Run browser smoke tests
        run: python frontend/tests/browser_smoke.py
