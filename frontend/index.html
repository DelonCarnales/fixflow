<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FixFlow repair order management">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>FixFlow - Repair Desk</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">F</div><div><strong>FixFlow</strong><span>Repair desk</span></div></div>
      <p class="nav-caption">WORKSPACE</p>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard">▦ &nbsp; Dashboard</button>
        <button class="nav-item" data-page="orders">▤ &nbsp; Repair orders</button>
        <button class="nav-item" data-page="parts">▧ &nbsp; Spare parts</button>
        <button class="nav-item" data-page="lookup">⌕ &nbsp; Customer lookup</button>
      </nav>
      <div class="sidebar-bottom"><div class="shop-avatar">RS</div><div><strong>Repair Shop</strong><span>Local workspace</span></div></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="breadcrumbs">Workspace <span>/</span> <strong id="breadcrumb-title">Dashboard</strong></div><div class="topbar-right"><span class="connection-dot"></span><span id="connection-mode">Connecting...</span> <span class="user-avatar">N</span></div></header>
      <div id="page-content" class="page-content"><div class="empty-state">Loading FixFlow...</div></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
